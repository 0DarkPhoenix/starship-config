[username]
    format     ='[ $user ]($style)'
    show_always=true
    style_root ="bold fg:color_danger"
    style_user ="fg:color_username"

[directory]
    fish_style_pwd_dir_length=0
    format                   ="[ $path ]($style)"
    home_symbol              ="~"
    read_only                =" "
    read_only_style          ="fg:color_directory"
    repo_root_style          ="bold fg:color_directory"
    style                    ="fg:color_directory"
    truncate_to_repo         =true
    truncation_length        =4
    truncation_symbol        ="…/"
    use_logical_path         =true

[git_branch]
    always_show_remote=false
    disabled          =false
    format            ='( [$symbol $branch]($style) )'
    ignore_branches   =[]
    only_attached     =true
    style             ="fg:color_git"
    symbol            =""
    truncation_length =25
    truncation_symbol ="..."

[git_commit]
    commit_hash_length=7
    disabled          =false
    format            ="( [($tag)(@$hash)]($style) )"
    only_detached     =true
    style             ="fg:color_git"
    tag_disabled      =false
    tag_symbol        ="󰓼 "

[git_status]
    ahead            ="↑${count} ↓0 "
    behind           ="↑0 ↓${count} "
    conflicted       ="=${count}"
    deleted          ="×${count}"
    disabled         =false
    diverged         ="↑${ahead_count} ↓${behind_count} "
    format           ='([$ahead_behind]($style) )([$all_status]($style) )'
    ignore_submodules=false
    modified         ="!${count}"
    renamed          ="»${count}"
    staged           ="+${count}"
    stashed          ="*${count}"
    style            ="fg:color_git"
    untracked        ="?${count}"
    up_to_date       =""

[git_metrics]
    added_style       ="fg:color_git_added"
    deleted_style     ="fg:color_git_deleted"
    disabled          =false
    format            ='([([+$added]($added_style))([-$deleted]($deleted_style))](fg:color_git) )'
    only_nonzero_diffs=true

[git_state]
    am          ="AM"
    am_or_rebase="AM/REBASE"
    bisect      ="BISECTING"
    cherry_pick ="CHERRY-PICKING"
    disabled    =false
    format      ='([$state( $progress_current/$progress_total)]($style bold) )'
    merge       ="MERGING"
    rebase      ="REBASING"
    revert      ="REVERTING"
    style       ="fg:color_danger"

